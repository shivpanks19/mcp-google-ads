# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo in Render Dashboard → New → Blueprint (or Web Service with these settings).

services:
  - type: web
    name: mcp-google-ads
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GOOGLE_ADS_AUTH_TYPE
        value: service_account
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CREDENTIALS_JSON
        sync: false
      # Hexanovate manager MCC (Keyword Planner + child accounts). Not Roombr client 6399164303.
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        value: "1698765209"
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_EMAIL_LEADS_TAB
        value: "E-mail leads"
      - key: GOOGLE_SHEETS_LEAD_PIPELINE_TAB
        value: "Lead Pipeline"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
